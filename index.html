<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectOps - 프로젝트 관리</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <div class="topbar__title-wrap">
          <p class="eyebrow">ProjectOps</p>
          <h1>1차 프로젝트 운영 화면</h1>
          <p>등록, 상세 조회, 진행사항 업데이트를 한 곳에서 관리</p>
        </div>
        <div class="summary" id="summary-box"></div>
      </header>

      <nav class="nav-tabs" aria-label="프로젝트 메뉴">
        <button type="button" class="tab-btn is-active" data-view="list">프로젝트 목록</button>
        <button type="button" class="tab-btn" data-view="create">프로젝트 등록</button>
        <button type="button" class="tab-btn" data-view="detail">프로젝트 상세</button>
        <button type="button" class="tab-btn" data-view="edit">프로젝트 수정</button>
        <button type="button" class="tab-btn" data-view="update">진행사항 업데이트</button>
      </nav>

      <section class="panel view-panel hidden" data-view-panel="create">
        <div class="panel-head">
          <h2 id="project-form-title">프로젝트 등록</h2>
          <button type="button" class="ghost" id="reset-form-btn">초기화</button>
        </div>
        <form id="project-form" class="grid-form">
          <input id="project-id" name="projectId" type="hidden" />
          <label>
            프로젝트명
            <input id="project-name" name="projectName" required placeholder="예: 고도화 BI 구축" />
          </label>
          <label>
            유형
            <select id="project-type" name="projectType" required>
              <option value="고객사">고객사</option>
              <option value="사내">사내</option>
            </select>
          </label>
          <label>
            고객사명
            <input id="client-name" name="clientName" placeholder="고객사형일 때 필수" />
          </label>
          <label>
            담당자/PM
            <input id="project-pm" name="projectPm" required placeholder="예: 김유정" />
          </label>
          <label>
            참여 인력
            <input id="project-members" name="projectMembers" placeholder="예: 박민수, 이도현" />
          </label>
          <label>
            시작일
            <input id="start-date" name="startDate" type="date" required />
          </label>
          <label>
            종료일
            <input id="end-date" name="endDate" type="date" required />
          </label>
          <label>
            계획 맨먼스
            <input id="planned-manmonths" name="plannedManmonths" type="number" min="0" step="0.5" required />
          </label>
          <label>
            계약/확정 맨먼스
            <input id="contract-manmonths" name="contractManmonths" type="number" min="0" step="0.5" required />
          </label>
          <label>
            사용 맨먼스
            <input id="used-manmonths" name="usedManmonths" type="number" min="0" step="0.5" required />
          </label>
          <label>
            예상 맨먼스
            <input id="expected-manmonths" name="expectedManmonths" type="number" min="0" step="0.5" required />
          </label>
          <label>
            진행률
            <div class="inline-control">
              <input id="project-progress" name="progress" type="range" min="0" max="100" value="0" />
              <span id="progress-value">0%</span>
            </div>
          </label>
          <label>
            상태
            <select id="project-status" name="status" required>
              <option>계획</option>
              <option>진행중</option>
              <option>위험</option>
              <option>완료</option>
              <option>보류</option>
            </select>
          </label>
          <label class="full">
            리스크
            <textarea id="project-risk" name="risk" rows="2" placeholder="현재 리스크를 정리하세요."></textarea>
          </label>
          <label class="full">
            프로젝트 메모
            <textarea id="project-memo" name="memo" rows="2" placeholder="고객 요구사항, 전제 조건 등을 입력하세요."></textarea>
          </label>
          <div class="actions full">
            <button type="submit" class="primary" id="save-btn">프로젝트 저장</button>
            <span id="form-help">등록 모드</span>
          </div>
        </form>
      </section>

      <section class="panel view-panel" data-view-panel="list">
        <div class="panel-head panel-head--tight">
          <h2>프로젝트 목록</h2>
          <p class="list-title-note">프로젝트 검색, 유형/상태 필터로 목록을 중심으로 관리합니다.</p>
          <div class="filters">
            <input id="project-search" type="search" placeholder="프로젝트명/PM/고객사 검색" />
            <select id="type-filter">
              <option value="">유형 전체</option>
              <option value="고객사">고객사</option>
              <option value="사내">사내</option>
            </select>
            <select id="status-filter">
              <option value="">상태 전체</option>
              <option>계획</option>
              <option>진행중</option>
              <option>위험</option>
              <option>완료</option>
              <option>보류</option>
            </select>
          </div>
        </div>
        <div class="project-list" id="project-list"></div>
      </section>

      <section class="panel view-panel hidden" data-view-panel="detail">
        <div class="panel-head">
          <h2>프로젝트 상세</h2>
          <div class="actions">
            <button type="button" id="open-edit-btn" class="ghost">수정 화면 열기</button>
            <button type="button" id="open-update-btn" class="primary">진행사항 업데이트</button>
            <button type="button" id="delete-project-btn" class="ghost danger">선택 프로젝트 삭제</button>
          </div>
        </div>
        <div id="project-detail-empty" class="empty-state">목록에서 프로젝트를 선택하면 상세 정보를 확인하고 진행사항을 기록할 수 있습니다.</div>
        <div id="project-detail" class="hidden">
          <div class="detail-grid">
            <section class="detail-card">
              <h3 id="detail-title"></h3>
              <p id="detail-type"></p>
              <p id="detail-period"></p>
              <p id="detail-owner"></p>
              <p id="detail-members"></p>
              <p id="detail-manmonths"></p>
              <p id="detail-progress">진행률: <b id="detail-progress-value"></b></p>
              <div class="progress-bar"><span id="detail-progress-bar"></span></div>
              <p id="detail-status"></p>
            </section>
            <section class="detail-card">
              <h4>리스크/메모</h4>
              <p id="detail-risk"></p>
              <p id="detail-memo"></p>
              <p id="detail-updated"></p>
            </section>
          </div>

          <div class="timeline" id="update-list"></div>
        </div>
      </section>

      <section class="panel view-panel hidden" data-view-panel="update">
        <div class="panel-head">
          <h2>진행사항 업데이트</h2>
          <div class="actions">
            <button type="button" id="open-detail-btn" class="ghost">상세 화면</button>
          </div>
        </div>
        <div id="update-empty" class="empty-state">프로젝트를 선택하면 진행사항 업데이트를 등록할 수 있습니다.</div>
        <form id="update-form" class="grid-form grid-form--small hidden">
          <label>
            작성일
            <input id="update-date" name="updateDate" type="date" required />
          </label>
          <label>
            작성자
            <input id="update-author" name="author" required placeholder="예: 박민수" />
          </label>
          <label class="full">
            이번 업데이트 내용
            <textarea id="update-content" name="content" rows="2" placeholder="진행한 핵심 작업" required></textarea>
          </label>
          <label class="full">
            다음 계획
            <textarea id="update-next-plan" name="nextPlan" rows="2" placeholder="다음 회차 작업"></textarea>
          </label>
          <label class="full">
            이슈/리스크
            <textarea id="update-risk" name="riskIssue" rows="2" placeholder="발생 이슈 또는 대응 리스크"></textarea>
          </label>
          <label>
            진척률 변경
            <div class="inline-control">
              <input id="update-progress" name="progress" type="range" min="0" max="100" value="0" />
              <span id="update-progress-value">0%</span>
            </div>
          </label>
          <div class="actions full">
            <button type="submit" class="primary">진행사항 저장</button>
          </div>
        </form>
      </section>
    </main>

    <template id="project-card-template">
      <article class="project-card">
        <div class="project-card-head">
          <h3 class="pc-title"></h3>
          <span class="chip"></span>
        </div>
        <p class="pc-meta pc-client"></p>
        <p class="pc-meta pc-period"></p>
        <p class="pc-meta pc-members"></p>
        <p class="pc-meta pc-manmonths"></p>
        <div class="pc-progress-label">진행률 <span class="pc-progress-val"></span></div>
        <div class="progress-bar"><span class="pc-progress-bar"></span></div>
        <div class="pc-actions">
          <button type="button" class="primary select-btn">상세 보기</button>
          <button type="button" class="ghost edit-btn">수정</button>
          <button type="button" class="ghost danger delete-btn">삭제</button>
        </div>
      </article>
    </template>

    <template id="update-item-template">
      <article class="update-item">
        <header>
          <h5 class="update-title"></h5>
          <span class="update-date"></span>
        </header>
        <p class="update-content"></p>
        <p class="update-next"></p>
        <p class="update-risk"></p>
        <p class="update-progress"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
